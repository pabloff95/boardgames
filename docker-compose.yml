services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build:
      target: dev
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ALLOWED_HOSTS=0.0.0.0
      - POSTGRES_DB=boadgames
      - POSTGRES_USER=pablo
      - POSTGRES_PASSWORD=1234

volumes:
  postgres_data: